spring.application.name=Jobboard

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=true

spring.security.jdbc.users-by-username-query=SELECT username, password, enabled FROM users WHERE username = ?
spring.security.jdbc.authorities-by-username-query=SELECT username, authority FROM authorities WHERE username = ?